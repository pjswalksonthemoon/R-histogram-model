name: R smoke test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - name: Install app packages
        run: Rscript -e 'install.packages(c("shiny", "plotly", "DT"), repos="https://cloud.r-project.org")'
      - name: Parse and smoke test
        run: Rscript tests/smoke.R
