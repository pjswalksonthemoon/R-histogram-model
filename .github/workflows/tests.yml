name: R smoke test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libuv1-dev libcurl4-openssl-dev
      - name: Install app packages
        run: Rscript -e 'install.packages(c("shiny", "plotly", "DT"), repos=Sys.getenv("RSPM"))'
      - name: Run smoke test
        run: Rscript tests/smoke.R
